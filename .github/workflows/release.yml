name: Publicar release de entrega

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NOMBRE_ENTREGA: investigacion1_XUNA
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias
        run: bun install

      - name: Instalar librerias de sistema requeridas por Chromium headless
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libpangocairo-1.0-0

      - name: Relajar la restriccion de AppArmor sobre user namespaces sin privilegios
        # Ubuntu 23.10+ restringe por AppArmor la creacion de user namespaces sin privilegios a nivel de kernel.
        # Se relaja solo en este runner efimero y descartable que es el workaround oficial documentado por Chromium:
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Generar los diagramas (.svg y .pdf) a partir de diagramas/src/*.mmd
        run: bun run build:diagrams

      - name: Compilar el informe en LaTeX (pdflatex + biber vía latexmk)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: informe
          root_file: main.tex

      - name: Compilar la tabla resumen de funciones como PDF aparte
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: informe
          root_file: tabla-resumen.tex

      - name: Instalar LibreOffice para convertir el PDF a un editable
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer

      - name: Generar el documento editable (.docx) a partir del PDF compilado
        run: |
          set -e
          test -f informe/main.pdf || { echo "informe/main.pdf no existe"; ls -la informe; exit 1; }

          export HOME=/tmp/loffice-home
          mkdir -p "$HOME"

          intentos=0
          hasta=5
          until soffice --headless --norestore \
              -env:UserInstallation=file:///tmp/loffice-profile \
              --convert-to docx:"MS Word 2007 XML" \
              --outdir "$(pwd)" "$(pwd)/informe/main.pdf"; do
            intentos=$((intentos + 1))
            if [ "$intentos" -ge "$hasta" ]; then
              echo "soffice fallo tras $intentos intentos"
              exit 1
            fi
            echo "soffice fallo (intento $intentos/$hasta), reintentando en 5s..."
            pkill -9 soffice.bin 2>/dev/null || true
            rm -rf /tmp/loffice-profile
            sleep 5
          done

          mv main.docx informe.docx

      - name: Armar la carpeta de entrega
        run: |
          mkdir -p "$NOMBRE_ENTREGA/diagramas"

          # 1. Informe tecnico en PDD
          cp informe/main.pdf "$NOMBRE_ENTREGA/informe-tecnico.pdf"

          # 2. Documento editable
          cp informe.docx "$NOMBRE_ENTREGA/informe-editable.docx"

          cat > "$NOMBRE_ENTREGA/README.md" <<EOF
          # Sobre \`informe-editable.docx\`

          Este \`.docx\` es una conversion automatica del PDF ya compilado
          (\`informe-tecnico.pdf\`), generada con LibreOffice headless durante el release.

          Como consecuencia, algunos detalles de formato (tablas, referencias, estilo APA)
          pueden verse ligeramente distintos en Word respecto al PDF original.

          Esto tuvo que hacerse asi ya que el compilador pandoc no soporta el estilo APA7, tablas y diagramas
          asi que generaba un documento corrupto o vacio.

          La fuente de verdad del informe es el LaTeX en \`informe/main.tex\`
          dentro del repositorio:
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          EOF

          # 3. Tabla resumen de funciones, tambien como PDF aparte
          cp informe/tabla-resumen.pdf "$NOMBRE_ENTREGA/tabla-resumen-funciones.pdf"

          # 4. Diagramas utilizados durante el analisis (fuente .mmd + renders)
          cp -r diagramas/src "$NOMBRE_ENTREGA/diagramas/fuente"
          cp -r diagramas/output "$NOMBRE_ENTREGA/diagramas/renderizados"

      - name: Comprimir la entrega
        run: zip -r "$NOMBRE_ENTREGA.zip" "$NOMBRE_ENTREGA"

      - name: Publicar el release con el zip adjunto
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.NOMBRE_ENTREGA }}.zip
          generate_release_notes: true
