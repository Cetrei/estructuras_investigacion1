name: Publicar release de entrega

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NOMBRE_ENTREGA: investigacion1_XUNA
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias
        run: bun install

      - name: Instalar librerias de sistema requeridas por Chromium headless
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libpangocairo-1.0-0

      - name: Relajar la restriccion de AppArmor sobre user namespaces sin privilegios
        # Ubuntu 23.10+ (incluido el runner ubuntu-latest actual) restringe por
        # AppArmor la creacion de user namespaces sin privilegios a nivel de kernel.
        # El zygote de Chrome los necesita para su sandbox interno y falla con
        # "No usable sandbox!" incluso con --no-sandbox pasado a Puppeteer, porque
        # el intento de crear el namespace ocurre antes de que ese flag tenga efecto.
        # Se relaja solo en este runner efimero y descartable (no en una maquina
        # persistente), que es el workaround oficial documentado por Chromium:
        # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Generar los diagramas (.svg y .pdf) a partir de diagramas/src/*.mmd
        # bun run build:diagrams descarga su propio Chromium local en .cache/puppeteer/
        # (ver scripts/buildDiagrams.ts), no requiere ningun paso previo de instalacion.
        run: bun run build:diagrams

      - name: Compilar el informe en LaTeX (pdflatex + biber vía latexmk)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: informe
          root_file: main.tex

      - name: Instalar pandoc para el documento editable
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Generar el documento editable (.docx) a partir del informe
        run: |
          pandoc informe/main.tex \
            --from=latex --to=docx \
            --citeproc --bibliography=informe/referencias.bib \
            --resource-path=informe \
            --output=informe.docx

      - name: Armar la carpeta de entrega
        run: |
          mkdir -p "$NOMBRE_ENTREGA/diagramas"

          # 1. Informe tecnico en PDF (incluye la tabla resumen de funciones
          #    con su costo computacional, ver informe/secciones/12-costo-computacional.tex)
          cp informe/main.pdf "$NOMBRE_ENTREGA/informe-tecnico.pdf"

          # 2. Documento editable
          cp informe.docx "$NOMBRE_ENTREGA/informe-editable.docx"

          # 3. Diagramas utilizados durante el analisis (fuente .mmd + renders)
          cp -r diagramas/src "$NOMBRE_ENTREGA/diagramas/fuente"
          cp -r diagramas/output "$NOMBRE_ENTREGA/diagramas/renderizados"

      - name: Comprimir la entrega
        run: zip -r "$NOMBRE_ENTREGA.zip" "$NOMBRE_ENTREGA"

      - name: Publicar el release con el zip adjunto
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.NOMBRE_ENTREGA }}.zip
          generate_release_notes: true
