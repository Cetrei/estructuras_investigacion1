name: Publicar release de entrega

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NOMBRE_ENTREGA: investigacion1_XUNA
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias
        run: bun install

      - name: Instalar librerias de sistema requeridas por Chromium headless
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libpangocairo-1.0-0

      - name: Relajar la restriccion de AppArmor sobre user namespaces sin privilegios
        # Ubuntu 23.10+ restringe por AppArmor la creacion de user namespaces sin privilegios a nivel de kernel.
        # Se relaja solo en este runner efimero y descartable que es el workaround oficial documentado por Chromium:
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Generar los diagramas (.svg y .pdf) a partir de diagramas/src/*.mmd
        run: bun run build:diagrams

      - name: Compilar el informe en LaTeX (pdflatex + biber vía latexmk)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: informe
          root_file: main.tex

      - name: Compilar la tabla resumen de funciones como PDF aparte
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: informe
          root_file: tabla-resumen.tex

      - name: Armar la carpeta de entrega
        run: |
          mkdir -p "$NOMBRE_ENTREGA/diagramas"

          # 1. Informe tecnico en PDF
          cp informe/main.pdf "$NOMBRE_ENTREGA/informe-tecnico.pdf"

          # 2. Tabla resumen de funciones, tambien como PDF aparte
          cp informe/tabla-resumen.pdf "$NOMBRE_ENTREGA/tabla-resumen-funciones.pdf"

          # 3. Diagramas utilizados durante el analisis (fuente .mmd + renders)
          cp -r diagramas/src "$NOMBRE_ENTREGA/diagramas/fuente"
          cp -r diagramas/output "$NOMBRE_ENTREGA/diagramas/renderizados"

          cat > "$NOMBRE_ENTREGA/README.md" <<EOF
          # Sobre el documento editable (.docx)

          Este informe se realizo en LaTeX y como usa formaatos especiales de APA 7 no es renderizable a docs
          de manera directa, por lo que el documento editable se genero a mano con un convertidor en linea a partir del PDF final,

          La fuente de verdad del informe es el LaTeX dentro del repositorio:
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          EOF

      - name: Comprimir la entrega
        run: zip -r "$NOMBRE_ENTREGA.zip" "$NOMBRE_ENTREGA"

      - name: Publicar el release con el zip adjunto
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.NOMBRE_ENTREGA }}.zip
          generate_release_notes: true
